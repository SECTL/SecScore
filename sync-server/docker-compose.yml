services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - secscore_sync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sync

  sync-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: secscore-sync-server:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      BIND_ADDR: 0.0.0.0:8787
      SYNC_LOG_DIR: /app/logs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    volumes:
      - secscore_sync_server_logs:/app/logs
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8787/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - sync

volumes:
  secscore_sync_postgres_data:
  secscore_sync_server_logs:

networks:
  sync:
    driver: bridge
